version: '3.8'

services:
  smart-repair-web:
    build: .
    container_name: smart-repair-system
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      # Persist SQLite database and uploaded images across container restarts
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
    restart: always
